name: battery-tray

on:
  push:
    branches: [main]
    tags: ["battery-tray-v*"]
    paths: ["apps/battery-tray/**", ".github/workflows/battery-tray.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/battery-tray
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo clippy --release --locked -- -D warnings
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cyclone2-battery
          path: apps/battery-tray/target/release/cyclone2-battery.exe
      - if: startsWith(github.ref, 'refs/tags/battery-tray-v')
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#battery-tray-v}" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/battery-tray-v')
        uses: softprops/action-gh-release@v2
        with:
          name: cyclone2-battery ${{ steps.version.outputs.number }}
          body_path: apps/battery-tray/RELEASE.md
          files: apps/battery-tray/target/release/cyclone2-battery.exe
