name: battery-tray

on:
  push:
    branches: [main]
    tags: ["battery-tray-v*"]
    paths: ["apps/battery-tray/**", ".github/workflows/battery-tray.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Empty: build only."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/battery-tray
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo clippy --release --locked -- -D warnings
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cyclone2-battery
          path: apps/battery-tray/target/release/cyclone2-battery.exe
      - id: version
        shell: bash
        env:
          INPUT: ${{ inputs.version }}
        run: |
          number=$INPUT
          if [[ $GITHUB_REF == refs/tags/battery-tray-v* ]]; then number=${GITHUB_REF_NAME#battery-tray-v}; fi
          if [[ -n $number && ! $number =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "invalid version: $number"; exit 1; fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.number != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: battery-tray-v${{ steps.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: cyclone2-battery ${{ steps.version.outputs.number }}
          body_path: apps/battery-tray/RELEASE.md
          files: apps/battery-tray/target/release/cyclone2-battery.exe
