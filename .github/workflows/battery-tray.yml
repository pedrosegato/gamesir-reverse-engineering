name: battery-tray

on:
  push:
    branches: [main]
    tags: ["battery-tray-v*"]
    paths:
      - "examples/battery-led/**"
      - "!examples/battery-led/**/*.md"
      - "lib/src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/battery-tray.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Empty: build only."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - id: version
        shell: bash
        env:
          INPUT: ${{ inputs.version }}
        run: |
          number=$INPUT
          if [[ $GITHUB_REF == refs/tags/battery-tray-v* ]]; then number=${GITHUB_REF_NAME#battery-tray-v}; fi
          if [[ -n $number && ! $number =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "invalid version: $number"; exit 1; fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: npm run build:battery-tray -w examples -- --version "${VERSION:-0.0.0}"
      - name: self-test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $run = Start-Process -FilePath examples/battery-led/tray/dist/cyclone2-battery.exe -ArgumentList '--self-test', 'self-test.json' -Wait -PassThru
          Get-Content self-test.json
          exit $run.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: cyclone2-battery
          path: examples/battery-led/tray/dist/cyclone2-battery.exe
          retention-days: 7
      - if: steps.version.outputs.number != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: battery-tray-v${{ steps.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: cyclone2-battery ${{ steps.version.outputs.number }}
          body_path: examples/battery-led/tray/RELEASE.md
          files: examples/battery-led/tray/dist/cyclone2-battery.exe
