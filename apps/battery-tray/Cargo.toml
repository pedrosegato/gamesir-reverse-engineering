[package]
name = "cyclone2-battery"
version = "0.1.0"
edition = "2024"
description = "Nível de bateria do GameSir Cyclone 2 no LED Home e na bandeja do Windows"
license = "MIT"
publish = false

[dependencies]

[target."cfg(windows)".dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
tao = "0.37.1"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
winreg = "0.56.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
